# NANDA Registry — production stack
#
# Prerequisites:
#   1. cp .env.prod.example .env.prod  — fill in all values
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Caddy exposes (open these ports in your Droplet firewall):
#   :8080 → Registry Web  (Next.js)
#   :3002 → Registry API  (Fastify)
#
# Postgres is internal only — not reachable from outside.

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nanda_registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d nanda_registry"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://registry:${POSTGRES_PASSWORD}@db:5432/nanda_registry
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PORT: 3000
    depends_on:
      - server
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
      - "3002:3002"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - web
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
