# NANDA Registry — full stack
#
# Spins up: Postgres DB, Registry Server (Fastify), Registry Web (Next.js)
#
# Quick start:
#   cp .env.example .env        # set REGISTRY_ADMIN_TOKEN at minimum
#   docker compose up --build
#
# Registry API:  http://localhost:3002
# Registry Web:  http://localhost:3000

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nanda_registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry-local}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d nanda_registry"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://registry:${POSTGRES_PASSWORD:-registry-local}@db:5432/nanda_registry
      REGISTRY_ADMIN_TOKEN: ${REGISTRY_ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-registry-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
